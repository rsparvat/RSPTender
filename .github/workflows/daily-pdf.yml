name: Daily Tender PDFs

# Every morning: 4 PDFs (Singrauli MP / NCL x today / all open tenders) in data/pdf/
# (https://tenders.rsparvat.com/data/pdf/...) and posted to Telegram @TenderAlert
# when the TELEGRAM_BOT_TOKEN secret is set.
on:
  schedule:
    # GitHub often starts scheduled runs late (sometimes hours), so try several times;
    # the first run of the day does the work, the later ones see it is done and stop.
    - cron: '22 0 * * *'   # 05:52 IST
    - cron: '42 0 * * *'   # 06:12 IST
    - cron: '12 1 * * *'   # 06:42 IST
    - cron: '42 1 * * *'   # 07:12 IST
    - cron: '12 2 * * *'   # 07:42 IST
    - cron: '42 2 * * *'   # 08:12 IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Aaj ki PDF dobara banao aur Telegram par bhejo (chahe pehle ja chuki ho)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Hindi fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-core
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Make the PDFs and post them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ vars.TELEGRAM_CHAT_IDS }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python daily_pdf.py
      - name: Save the PDFs in the repository
        run: |
          git config user.name 'RSP Tender Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/pdf
          git diff --cached --quiet || git commit -m 'Daily tender PDFs'
          git pull --rebase
          git push
      - name: Publish to the website
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
