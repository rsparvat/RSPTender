name: Keep Tender Refresh Running

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-loop.yml'
  workflow_run:
    workflows: ["Update Tender Data"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: tender-refresh-loop
  cancel-in-progress: true

jobs:
  queue-next-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Wait before the next cloud scan
        run: sleep 2100
      - name: Start Update Tender Data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/update-tenders.yml/dispatches" \
            -d '{"ref":"main"}'
