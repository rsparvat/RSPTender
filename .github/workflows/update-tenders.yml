name: Update Tender Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'requirements.txt'
      - '.github/workflows/update-tenders.yml'
      - '.github/workflows/refresh-loop.yml'
  schedule:
    # Frequent off-boundary attempts reduce the impact of delayed/dropped GitHub schedules.
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch MP and Coal India tenders
        timeout-minutes: 17
        env:
          PORTAL_BUDGET_SECONDS: '360'
          MAX_DETAIL_FETCH_PER_PORTAL: '900'
          DETAIL_REFRESH_HOURS: '6'
          CONNECT_TIMEOUT: '10'
          READ_TIMEOUT: '45'
          ORG_INDEX_READ_TIMEOUT: '75'
          REQUEST_RETRIES: '3'
        run: python scraper.py
      - name: Send favourite tender alerts
        # Web Push to subscribers whose favourite districts / organisations got
        # new or closing-soon tenders. Never blocks the data refresh.
        continue-on-error: true
        timeout-minutes: 8
        env:
          PUSH_API: https://script.google.com/macros/s/AKfycbz8DOoxFFaLOJOI2NsnbrN7kH7MAdBkjxtxEYcJJ56PA7B2xMun7SjWN3VUMTm5Aw/exec
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$PUSH_TOKEN" ]; then echo "push secrets not set"; exit 0; fi
          pip install pywebpush playwright
          python -m playwright install --with-deps chromium
          python push_notify.py
      - name: Commit refreshed cache
        run: |
          git config user.name 'RSP Tender Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tenders.json
          if [ -f data/push_state.json ]; then git add data/push_state.json; fi
          git diff --cached --quiet || git commit -m 'Auto update tender data'
          git pull --rebase
          git push
      - name: Publish the new data to the website
        # Runs started by the bot's own dispatch do not fire workflow_run,
        # so the website deploy is started here directly after every refresh.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: Start the daily PDFs if today's are not made yet
        # GitHub drops most scheduled runs of daily-pdf.yml, but this refresh runs
        # every ~35 minutes, so it starts the PDFs once after 05:50 IST each day.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); today=$(TZ=Asia/Kolkata date +%F)
          made=$(python3 -c "import json;print(json.load(open('data/pdf/today.json')).get('iso',''))" 2>/dev/null || true)
          if [ $((10#$now)) -ge 550 ] && [ "$made" != "$today" ]; then
            echo "starting daily PDFs for $today"
            curl --fail-with-body --retry 3 --retry-all-errors -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/daily-pdf.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "daily PDFs: nothing to start (time $now, done for '$made')"
          fi
