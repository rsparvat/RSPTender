name: Update Tender Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'requirements.txt'
      - '.github/workflows/update-tenders.yml'
  schedule:
    # Primary 15-minute refresh, offset from busy quarter-hour boundaries.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: tender-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch MP and Coal India tenders
        timeout-minutes: 17
        env:
          PORTAL_BUDGET_SECONDS: '360'
          MAX_DETAIL_FETCH_PER_PORTAL: '900'
          DETAIL_REFRESH_HOURS: '6'
          CONNECT_TIMEOUT: '10'
          READ_TIMEOUT: '45'
          ORG_INDEX_READ_TIMEOUT: '75'
          REQUEST_RETRIES: '3'
        run: python scraper.py
      - name: Commit refreshed cache
        run: |
          git config user.name 'RSP Tender Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tenders.json
          git diff --cached --quiet || git commit -m 'Auto update tender data'
          git pull --rebase
          git push
