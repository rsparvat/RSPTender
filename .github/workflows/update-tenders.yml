name: Update Tender Data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: tender-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch MP and Coal India tenders
        timeout-minutes: 4
        run: python scraper.py
      - name: Commit refreshed cache
        run: |
          git config user.name 'RSP Tender Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tenders.json
          git diff --cached --quiet || git commit -m 'Auto update tender data'
          git push
