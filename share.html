<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>टेंडर PDF शेयर – RSP</title>
<link rel="icon" href="assets/rsp-icon-192.png">
<style>
:root{--blue:#17365d;--wa:#1fa855;--bg:#eef2f7;--line:#d5dde8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1b2533;font-family:"Segoe UI","Nirmala UI","Noto Sans","Noto Sans Devanagari",Roboto,Arial,sans-serif;font-size:16px}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:6px;background:#fff}
header b{display:block;font-size:17px}header span{font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.note{background:#fff7e0;border:1px solid #f0c36d;border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:12px;line-height:1.45}
.note.err{background:#fde8e8;border-color:#e7a1a1}
.opt{display:flex;align-items:center;gap:8px;font-size:15px;margin:4px 0 12px}
.opt input{width:20px;height:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card.off{opacity:.55}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.35}
.meta{font-size:13px;color:#555;margin-bottom:10px;word-break:break-all}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:#e3f6ea;color:#11743b;margin-left:4px;vertical-align:middle}
.btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
button,a.btn{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
button.wa{background:var(--wa);border-color:var(--wa);color:#fff}
button.big{width:100%;margin-bottom:14px;min-height:52px;font-size:17px}
button:disabled{opacity:.5;cursor:default}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b2533;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;max-width:90%}
</style>
</head>
<body>
<header><img src="assets/rsp-icon-192.png" alt=""><div><b>टेंडर PDF – WhatsApp पर भेजें</b><span id="day">लोड हो रहा है…</span></div></header>
<main>
  <div id="msg" class="note">PDF के साथ उसका पूरा विवरण और सही फ़ाइल-नाम जाएगा। हरे बटन से WhatsApp चुनें, फिर ग्रुप / चैनल चुनकर भेजें।</div>
  <label class="opt"><input type="checkbox" id="withLinks" checked> नीचे लिंक भी जोड़ें (लाइव लिस्ट, ग्रुप, DSC आदि)</label>
  <button class="wa big" id="allBtn" disabled>📤 आज की सभी PDF एक साथ भेजें</button>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let data=null;const cache={};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function textFor(items){let t=items.map(i=>i.caption).join('\n');if($('withLinks').checked&&data.links)t+='\n\n'+data.links;return t}
async function fileFor(i){if(!cache[i.file]){const r=await fetch('data/pdf/'+i.file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('PDF '+r.status);cache[i.file]=new File([await r.blob()],i.name,{type:'application/pdf'})}return cache[i.file]}
const canFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'t.pdf',{type:'application/pdf'})]}))}catch(e){return false}};
async function share(items){
  const text=textFor(items);
  try{
    const files=await Promise.all(items.map(fileFor));
    if(canFiles()&&navigator.canShare({files})){await navigator.share({files,text});return}
  }catch(e){if(e&&e.name==='AbortError')return;console.log(e)}
  await copy(text);toast('इस ब्राउज़र में सीधा शेयर नहीं हुआ – टेक्स्ट कॉपी हो गया, PDF अलग से डाउनलोड करें')}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('टेक्स्ट कॉपी हो गया')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('टेक्स्ट कॉपी हो गया')}}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';let pdfjsP=null;const shots={};
function pdfjs(){return pdfjsP||(pdfjsP=new Promise((ok,no)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok(pdfjsLib)};s.onerror=()=>{pdfjsP=null;no(new Error('pdf.js'))};document.head.appendChild(s)}))}
async function photoFiles(i){if(shots[i.file])return shots[i.file];const lib=await pdfjs(),doc=await lib.getDocument({url:'data/pdf/'+i.file+'?t='+Date.now(),cMapUrl:PDFJS+'cmaps/',cMapPacked:true}).promise,base=i.name.replace(/\.pdf$/i,''),out=[];
  for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),vp=page.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:ctx,viewport:vp}).promise;
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));out.push(new File([blob],`${base}${doc.numPages>1?'_page-'+p:''}.jpg`,{type:'image/jpeg'}))}
  return shots[i.file]=out}
async function sharePhotos(k,btn){const i=data.items[k],label='🖼️ फोटो';
  if(!shots[i.file]){btn.disabled=true;btn.textContent='⏳ बन रही है';try{await photoFiles(i)}catch(e){console.log(e);toast('फोटो नहीं बन पाई');btn.disabled=false;btn.textContent=label;return}btn.disabled=false;btn.textContent=label}
  const files=shots[i.file];
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:textFor([i])});return}}
  catch(e){if(e&&e.name==='AbortError')return;if(e&&e.name==='NotAllowedError'){btn.textContent='📤 फोटो भेजें';toast('फोटो तैयार हैं – भेजने के लिए बटन फिर दबाएँ');return}console.log(e)}
  for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,400))}
  toast('फोटो डाउनलोड हो गईं')}
function draw(){
  $('day').textContent=data.date+(data.all_day?' · आज "सभी लाइव" वाली PDF भी भेजनी हैं':'');
  $('list').innerHTML=data.items.map((i,k)=>`<div class="card${i.count?'':' off'}"><h3>${esc(i.caption.split('\n')[0])}${i.send?'<span class="tag">आज भेजें</span>':''}</h3>
  <div class="meta">📄 ${esc(i.name)}${i.count?'':' · आज कोई टेंडर नहीं'}</div>
  <div class="btns"><button class="wa" data-k="${k}" ${i.count?'':'disabled'}>📤 WhatsApp</button><button data-img="${k}" ${i.count?'':'disabled'}>🖼️ फोटो</button><a class="btn" href="data/pdf/${encodeURIComponent(i.file)}" download="${esc(i.name)}" data-dl="${k}">⬇️ PDF</a></div></div>`).join('');
  const send=data.items.filter(i=>i.send);$('allBtn').disabled=!send.length;$('allBtn').textContent=send.length?`📤 आज की ${send.length} PDF एक साथ भेजें`:'आज भेजने के लिए कोई PDF नहीं';
  if(!canFiles()){$('msg').className='note err';$('msg').textContent='यह पेज फ़ोन के Chrome में खोलें – वहीं से PDF और विवरण सीधे WhatsApp में जाते हैं। यहाँ “PDF” बटन से डाउनलोड कर सकते हैं।'}
}
document.addEventListener('click',async e=>{const a=e.target.closest('a[data-dl]');if(!a||!data)return;e.preventDefault();const i=data.items[+a.dataset.dl];if(a.dataset.open){location.href='data/pdf/'+i.file+'?v='+(data.iso||'');return}const old=a.textContent;a.textContent='⏳ डाउनलोड…';
  try{const r=await fetch('data/pdf/'+i.file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const u=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:'application/pdf'})),x=document.createElement('a');x.href=u;x.download=i.name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);a.textContent='📂 PDF खोलें';a.dataset.open='1';setTimeout(()=>{a.textContent=old;delete a.dataset.open},20000)}
  catch(err){a.textContent=old;location.href=a.href}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!data)return;
  if(b.id==='allBtn')share(data.items.filter(i=>i.send));
  else if(b.dataset.k!==undefined)share([data.items[+b.dataset.k]]);
  else if(b.dataset.img!==undefined)sharePhotos(+b.dataset.img,b)});
fetch('data/pdf/today.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{const ist=new Date(Date.now()+19800000),today=ist.toISOString().slice(0,10);if(d.iso!==today){const early=ist.getUTCHours()<7;$('day').textContent='';document.querySelectorAll('#allBtn,.opt,#msg').forEach(e=>e.style.display='none');$('list').innerHTML='<div class="note err" style="background:#fde8e8;border:1px solid #e7a1a1;border-radius:8px;padding:10px 12px">'+(early?'⏳ आज की टेंडर लिस्ट अभी नहीं आई है। कृपया थोड़ी देर बाद खोलें।':'⏳ आज की टेंडर लिस्ट अभी तैयार नहीं हुई है। कृपया थोड़ी देर बाद दोबारा खोलें।')+'</div>';return}data=d;draw()})
  .catch(()=>{$('day').textContent='';$('msg').className='note err';$('msg').textContent='आज की PDF जानकारी नहीं मिली। कृपया थोड़ी देर बाद दोबारा खोलें।'});
</script>
</body>
</html>
