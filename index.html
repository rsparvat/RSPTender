<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>RSP Tender Monitor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}.top{background:linear-gradient(135deg,#132d4f,#245b8f);color:white;padding:18px 14px}.brand{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:30px;font-weight:900}.tag{font-size:12px;opacity:.9}.live{font-size:12px;background:#ffffff20;border:1px solid #ffffff35;border-radius:999px;padding:7px 10px}.wrap{max-width:1400px;margin:auto;padding:12px}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.filters button,select,input{border:1px solid #ccd6e3;background:white;border-radius:10px;padding:10px 12px;font-size:14px}.tabs button.active{background:#17365d;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.filters{background:white;padding:10px;border-radius:12px;border:1px solid #dde5ef;margin-bottom:10px}.filters input{flex:2;min-width:200px}.filters select{flex:1;min-width:140px}.status{font-size:12px;color:#637083;margin:8px 2px}.cards{display:grid;gap:10px}.card{background:white;border:1px solid #dce5ef;border-radius:14px;padding:13px;box-shadow:0 2px 8px #1020300b}.row{display:flex;justify-content:space-between;gap:10px}.id{font-weight:800;color:#174f84;overflow-wrap:anywhere}.badge{white-space:nowrap;background:#eaf2fb;color:#174f84;padding:5px 8px;border-radius:999px;font-size:11px;height:max-content}.work{font-weight:700;margin:9px 0;line-height:1.35}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;font-size:12px}.m{background:#f7f9fc;padding:7px;border-radius:8px}.m span{display:block;color:#718096;font-size:10px;margin-bottom:3px}.actions{display:flex;gap:8px;margin-top:10px}.actions a{background:#17365d;color:white;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:12px}.corr{background:#fff2d8!important;color:#8a5700!important}.empty{text-align:center;padding:50px;color:#667}.foot{text-align:center;color:#7a8796;font-size:11px;padding:25px 8px}@media(max-width:700px){.logo{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(2,1fr)}.wrap{padding:8px}.top{padding:13px 9px}.card{padding:11px}}@media(min-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand"><div><div class="logo">RSP Tender Monitor</div><div class="tag">Reliable, Secure & Perfect • Web Monitor</div></div><div class="live" id="live">Loading live cache…</div></div></header><main class="wrap"><div class="tabs"><button id="MP" class="active" onclick="setPortal('MP')">MP Tenders</button><button id="COAL" onclick="setPortal('COAL')">Coal India Tenders</button></div><div class="stats"><div class="stat"><span>Visible</span><b id="sVisible">0</b></div><div class="stat"><span>Closing ≤ 3 Days</span><b id="sSoon">0</b></div><div class="stat"><span>Corrigendum</span><b id="sCorr">0</b></div><div class="stat"><span>Total Cache</span><b id="sTotal">0</b></div></div><div class="filters"><input id="q" placeholder="Search Tender ID, NIT, work, organisation, district…" oninput="render()"><select id="area" onchange="render()"><option value="">All District / Project</option></select><select id="sort" onchange="render()"><option value="closing">Closing Soonest</option><option value="newest">Newest Published</option><option value="pacLow">Tender Value Low → High</option><option value="pacHigh">Tender Value High → Low</option><option value="payLow">Total Payable Low → High</option><option value="payHigh">Total Payable High → Low</option><option value="az">Organisation A-Z</option><option value="corr">Recently Changed / Corrigendum</option></select><button onclick="load(true)">↻ Refresh</button></div><div class="status" id="status"></div><section class="cards" id="cards"></section><div class="foot">RSP Tender Monitor • Base: Desktop v2.6.1 AREA_PARSER_FIX • Ramashankar Parvat</div></main><script>let all=[],portal='MP';const $=x=>document.getElementById(x);function dt(s){if(!s)return null;let x=String(s).replace(/(\d{1,2})-([A-Za-z]{3})-(\d{4})/,'$1 $2 $3');let d=new Date(x);return isNaN(d)?null:d}function money(n){return n==null?'—':'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setPortal(p){portal=p;$('MP').classList.toggle('active',p==='MP');$('COAL').classList.toggle('active',p==='COAL');areas();render()}function areas(){let vals=[...new Set(all.filter(x=>x.source===portal).map(x=>portal==='COAL'?(x.project||x.location):(x.district||x.location)).filter(Boolean))].sort();$('area').innerHTML='<option value="">All District / Project</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join('')}function left(t){let d=dt(t.bid_end);if(!d)return '';let ms=d-Date.now();if(ms<=0)return 'Closed';let days=Math.floor(ms/86400000),hrs=Math.floor(ms%86400000/3600000);return days+'d '+hrs+'h'}function render(){let q=$('q').value.toLowerCase().trim(),a=$('area').value;let r=all.filter(x=>x.source===portal).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).filter(x=>!a||(portal==='COAL'?(x.project||x.location):(x.district||x.location))===a);let mode=$('sort').value;let val=x=>Number(x??Number.MAX_SAFE_INTEGER);r.sort((a,b)=>mode==='closing'?val(dt(a.bid_end)?.getTime())-val(dt(b.bid_end)?.getTime()):mode==='newest'?val(dt(b.published_date)?.getTime())-val(dt(a.published_date)?.getTime()):mode==='pacLow'?val(a.pac)-val(b.pac):mode==='pacHigh'?val(b.pac)-val(a.pac):mode==='payLow'?val(a.total_payable)-val(b.total_payable):mode==='payHigh'?val(b.total_payable)-val(a.total_payable):mode==='az'?String(a.organisation).localeCompare(String(b.organisation)):Number(b.corrigendum_count)-Number(a.corrigendum_count));$('sVisible').textContent=r.length;$('sTotal').textContent=all.length;$('sCorr').textContent=r.filter(x=>x.corrigendum_count).length;$('sSoon').textContent=r.filter(x=>{let d=dt(x.bid_end);return d&&d>Date.now()&&d-Date.now()<=259200000}).length;$('cards').innerHTML=r.length?r.map(t=>`<article class="card"><div class="row"><div class="id">${esc(t.tender_id)}</div><div class="badge">${esc(left(t))}</div></div><div class="work">${esc(t.work_en||'Tender')}</div><div class="meta"><div class="m"><span>${portal==='COAL'?'PROJECT':'DISTRICT'}</span>${esc(portal==='COAL'?(t.project||t.location||'—'):(t.district||t.location||'—'))}</div><div class="m"><span>ORGANISATION</span>${esc(t.organisation||'—')}</div><div class="m"><span>PAC / VALUE</span>${money(t.pac)}</div><div class="m"><span>EMD</span>${money(t.emd)}</div><div class="m"><span>TOTAL PAYABLE</span>${money(t.total_payable)}</div><div class="m"><span>NIT REF.</span>${esc(t.nit_ref||'—')}</div><div class="m"><span>PUBLISHED</span>${esc(t.published_date||'—')}</div><div class="m"><span>BID END</span>${esc(t.bid_end||'—')}</div></div><div class="actions"><a href="${esc(t.detail_url)}" target="_blank" rel="noopener">Open Tender</a>${t.corrigendum_url?`<a class="corr" href="${esc(t.corrigendum_url)}" target="_blank" rel="noopener">Corrigendum (${t.corrigendum_count})</a>`:''}</div></article>`).join(''):'<div class="empty">No tender in current filter.</div>'}async function load(force=false){$('status').textContent='Loading tender cache…';try{let r=await fetch('data/tenders.json'+(force?'?t='+Date.now():''),{cache:force?'no-store':'default'});let j=await r.json();all=j.tenders||[];let when=j.generated_at?new Date(j.generated_at).toLocaleString('en-IN'):'Waiting for first automatic scan';$('live').textContent='Data: '+when;$('status').textContent=(j.errors?.length?'Last scan warning: '+j.errors.join(' • '):'Auto-updated from public tender portals')+' • Base '+j.base_version;areas();render()}catch(e){$('status').textContent='Tender cache is not ready yet. First GitHub Action scan is required.'}}load();setInterval(()=>load(true),15*60*1000);</script></body></html>
